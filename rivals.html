<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 로그인하지 않고 이 화면 주소를 직접 열면 로그인 화면(index.html)으로 보낸다. (화면 잠금용이며 실제 보안은 아니다)
  try { if (!sessionStorage.getItem("cafe-session")) (window.top || window).location.replace("index.html"); } catch (e) { /* 저장소가 막혀 있으면 그냥 연다 */ }
</script>
<title>주변 카페</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 공통 디자인 값 (index.html의 :root 와 같은 값) */
  :root {
    --canvas: #FFFFFF;
    --canvas-200: #F7F7F7;
    --border: #C6C6C6;
    --hover: #F7F7F7;
    --text: #262626;
    --text-normal: #4C4C4C;
    --text-hint: #5D5D5D;
    --primary: #2A72E5;
    --primary-fg: #0957C8;
    --primary-soft: #EFF8FF;
    --success: #058765;
    --warning: #D34701;
    --danger: #DA3944;
    --danger-fg: #BB1225;
    --danger-soft: #FFF5F4;
    --success-soft: #EDFAF4;
    --star: #FBBD05;
    --bar-muted: #8DCDFF;
    --radius: 8px;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / .20);
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #232323;
      --canvas-200: #282828;
      --border: #474747;
      --hover: #363636;
      --text: #FAFAFA;
      --text-normal: #BEBEBE;
      --text-hint: #A7A7A7;
      --primary: #368AED;
      --primary-fg: #56ACF9;
      --primary-soft: #001286;
      --success: #46B993;
      --warning: #F58A56;
      --danger: #F14F5A;
      --danger-fg: #FD8283;
      --danger-soft: #590000;
      --success-soft: #003016;
      --star: #F4B402;
      --bar-muted: #0E5ACB;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--canvas-200);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  h1 { margin: 0; font-size: 24px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { margin: 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }

  .card {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 24px;
  }
  .card h2 { margin: 0 0 16px; font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: -0.1px; }

  .form { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 22px; color: var(--text-normal); font-weight: 500; min-width: 0; }
  input {
    font: inherit; height: 40px; padding: 0 12px; width: 100%; min-width: 0;
    border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--canvas); color: var(--text);
  }
  input:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }

  button, a.btn {
    font: inherit; font-weight: 500; height: 40px; padding: 0 20px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--canvas); color: var(--text-normal); cursor: pointer; white-space: nowrap;
    display: inline-flex; align-items: center; justify-content: center; text-decoration: none;
  }
  button:hover:not(:disabled), a.btn:hover { background: var(--hover); }
  button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--primary-fg); border-color: var(--primary-fg); }

  .map-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
  .map-head h2 { margin: 0; }
  .links { display: flex; gap: 8px; flex-wrap: wrap; }
  .map-frame {
    width: 100%; height: 480px; border: 1px solid var(--border);
    border-radius: var(--radius); background: var(--canvas-200); display: block;
  }
  .hint { margin: 12px 0 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .empty { padding: 48px 0; text-align: center; color: var(--text-hint); }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 12px 20px; border-radius: var(--radius);
    background: var(--text); color: var(--canvas);
    font-size: 14px; line-height: 22px; box-shadow: var(--shadow-sm);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger-fg); color: #fff; }

  @media (max-width: 720px) {
    body { padding: 16px; }
    .card { padding: 16px; }
    .form { grid-template-columns: 1fr; }
    .map-frame { height: 360px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>주변 카페</h1>
      <p class="sub">동네나 역 이름을 넣으면 그 근처 카페가 지도에 나옵니다. 경쟁 카페가 어디에 있는지 살펴보세요.</p>
    </header>

    <section class="card" aria-labelledby="search-title">
      <h2 id="search-title">동네 찾기</h2>
      <form id="form" class="form">
        <label>지역이나 역 이름
          <input id="f-area" required maxlength="50" autocomplete="off" placeholder="예: 연남동, 홍대입구역">
        </label>
        <button type="submit" class="primary">지도 보기</button>
      </form>
    </section>

    <section class="card" aria-live="polite">
      <div id="result"><div class="empty">지역이나 역 이름을 넣고 "지도 보기"를 눌러 주세요.</div></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>

<script>
  const $ = id => document.getElementById(id);

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.toggle("err", !!isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
  }

  // API 키가 필요 없는 주소만 쓴다: 구글 지도 퍼가기 주소(output=embed)와 네이버지도 검색 주소
  const googleEmbedUrl = q => `https://www.google.com/maps?q=${encodeURIComponent(q)}&hl=ko&z=15&output=embed`;
  const googleOpenUrl = q => `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  const naverUrl = q => `https://map.naver.com/p/search/${encodeURIComponent(q)}`;

  function showMap(area) {
    const query = `${area} 카페`;
    const frame = el("iframe", { className: "map-frame", title: `${area} 근처 카페 지도`, loading: "lazy", referrerPolicy: "no-referrer-when-downgrade" });
    frame.src = googleEmbedUrl(query);

    const naver = el("a", { className: "btn primary", href: naverUrl(query), target: "_blank", rel: "noopener noreferrer", textContent: "네이버맵에서 카페 찾기" });
    const google = el("a", { className: "btn", href: googleOpenUrl(query), target: "_blank", rel: "noopener noreferrer", textContent: "구글맵에서 크게 보기" });

    $("result").replaceChildren(
      el("div", { className: "map-head" },
        el("h2", { textContent: `${area} 근처 카페` }),
        el("div", { className: "links" }, naver, google)),
      frame,
      el("p", { className: "hint", textContent: "지도가 보이지 않으면 위의 링크로 열어 보세요. 링크는 새 창에서 열립니다." }));
  }

  $("form").addEventListener("submit", e => {
    e.preventDefault();
    const area = $("f-area").value.trim();
    if (!area) return toast("지역이나 역 이름을 입력해 주세요.", true);
    showMap(area);
  });
</script>
</body>
</html>
