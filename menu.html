<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // 로그인하지 않고 이 화면 주소를 직접 열면 로그인 화면(index.html)으로 보낸다. (화면 잠금용이며 실제 보안은 아니다)
  try { if (!sessionStorage.getItem("cafe-session")) (window.top || window).location.replace("index.html"); } catch (e) { /* 저장소가 막혀 있으면 그냥 연다 */ }
</script>
<title>메뉴 · 재고</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 공통 디자인 값 (index.html의 :root 와 같은 값) */
  :root {
    --canvas: #FFFFFF;
    --canvas-200: #F7F7F7;
    --border: #C6C6C6;
    --hover: #F7F7F7;
    --text: #262626;
    --text-normal: #4C4C4C;
    --text-hint: #5D5D5D;
    --primary: #2A72E5;
    --primary-fg: #0957C8;
    --primary-soft: #EFF8FF;
    --success: #058765;
    --warning: #D34701;
    --danger: #DA3944;
    --danger-fg: #BB1225;
    --danger-soft: #FFF5F4;
    --success-soft: #EDFAF4;
    --star: #FBBD05;
    --bar-muted: #8DCDFF;
    --radius: 8px;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / .20);
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #232323;
      --canvas-200: #282828;
      --border: #474747;
      --hover: #363636;
      --text: #FAFAFA;
      --text-normal: #BEBEBE;
      --text-hint: #A7A7A7;
      --primary: #368AED;
      --primary-fg: #56ACF9;
      --primary-soft: #001286;
      --success: #46B993;
      --warning: #F58A56;
      --danger: #F14F5A;
      --danger-fg: #FD8283;
      --danger-soft: #590000;
      --success-soft: #003016;
      --star: #F4B402;
      --bar-muted: #0E5ACB;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--canvas-200);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  h1 { margin: 0; font-size: 24px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { margin: 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }

  .card {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 24px;
  }
  .card h2 { margin: 0 0 16px; font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: -0.1px; }

  /* 입력 */
  label { display: flex; flex-direction: column; gap: 4px; font-size: 14px; line-height: 22px; color: var(--text-normal); font-weight: 500; }
  input, select {
    font: inherit;
    height: 40px;
    padding: 0 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--canvas);
    color: var(--text);
    width: 100%;
    min-width: 0;
  }
  input:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  input[type=number] { text-align: right; }

  .add-form { display: grid; grid-template-columns: 2fr 1.4fr 1fr 1fr auto; gap: 12px; align-items: end; }
  .order-form { display: grid; grid-template-columns: 3fr 1fr auto; gap: 12px; align-items: end; }
  .order-hint { margin: 12px 0 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }

  button {
    font: inherit;
    font-weight: 500;
    height: 40px;
    padding: 0 20px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--canvas);
    color: var(--text-normal);
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--primary-fg); border-color: var(--primary-fg); }

  /* 목록 */
  .list-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
  .list-head h2 { margin: 0; }
  .count { font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .table-scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 800px; }
  table.orders-table { min-width: 640px; }
  th {
    text-align: left;
    font-size: 14px; line-height: 22px; font-weight: 500;
    color: var(--text-hint);
    padding: 8px 8px 8px 0;
    border-bottom: 1px solid var(--border);
  }
  th.num, td.num { text-align: right; }
  td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  td.name { font-weight: 500; }
  td.cat { color: var(--text-normal); }
  td input { width: 110px; height: 36px; }
  td input[readonly] { background: var(--canvas-200); color: var(--text-normal); }
  td.act { text-align: right; padding-right: 0; white-space: nowrap; }
  td.act button { height: 36px; padding: 0 16px; }
  td.act button + button { margin-left: 8px; }
  button.danger { color: var(--danger-fg); border-color: var(--danger); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); }

  /* 재고 5개 이하: 빨간색 */
  tr.low td.name, tr.low td.stock-cell input { color: var(--danger-fg); }
  tr.low td.stock-cell input { border-color: var(--danger); background: var(--danger-soft); font-weight: 700; }
  .badge {
    display: inline-block;
    margin-left: 8px;
    padding: 0 8px;
    border-radius: 4px;
    font-size: 12px; line-height: 18px; font-weight: 700;
    color: var(--danger-fg);
    background: var(--danger-soft);
    border: 1px solid var(--danger);
    vertical-align: 1px;
  }

  /* 발주 상태 */
  .status {
    display: inline-block; padding: 0 8px; border-radius: 4px; border: 1px solid;
    font-size: 12px; line-height: 18px; font-weight: 700;
  }
  .status.wait { color: var(--warning); border-color: var(--warning); background: var(--canvas); }
  .status.done { color: var(--success); border-color: var(--success); background: var(--success-soft); }
  .status.cancel { color: var(--text-hint); border-color: var(--border); background: var(--canvas-200); }
  td.when { color: var(--text-hint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  td.orderer { font-weight: 500; white-space: nowrap; }

  .empty, .error { padding: 32px 0; text-align: center; color: var(--text-hint); }
  .error { color: var(--danger-fg); }
  .error button { margin-top: 12px; }

  /* 알림 */
  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 12px 20px; border-radius: var(--radius);
    background: var(--text); color: var(--canvas);
    font-size: 14px; line-height: 22px;
    box-shadow: var(--shadow-sm);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger-fg); color: #fff; }

  @media (max-width: 720px) {
    body { padding: 16px; }
    .card { padding: 16px; }
    .add-form { grid-template-columns: 1fr 1fr; }
    .add-form button { grid-column: 1 / -1; }
    .order-form { grid-template-columns: 1fr 1fr; }
    .order-form label:first-child, .order-form button { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>메뉴 · 재고</h1>
      <p class="sub" id="menu-sub">메뉴를 추가하고 가격과 재고를 고칩니다. 재고가 5개 이하이면 빨간색으로 표시됩니다.</p>
    </header>

    <section class="card" id="add-card" aria-labelledby="add-title">
      <h2 id="add-title">메뉴 추가</h2>
      <form id="add-form" class="add-form">
        <label>이름<input id="f-name" required maxlength="40" autocomplete="off"></label>
        <label>분류<input id="f-category" required maxlength="20" list="categories" autocomplete="off"></label>
        <label>가격(원)<input id="f-price" type="number" min="0" step="1" required inputmode="numeric"></label>
        <label>재고(개)<input id="f-stock" type="number" min="0" step="1" required inputmode="numeric" value="0"></label>
        <button type="submit" class="primary" id="add-btn">추가</button>
        <datalist id="categories"></datalist>
      </form>
    </section>

    <section class="card" id="order-card" aria-labelledby="order-title">
      <h2 id="order-title">재고 발주</h2>
      <form id="order-form" class="order-form">
        <label>메뉴
          <select id="f-order-menu" required><option value="">불러오는 중...</option></select>
        </label>
        <label>발주 수량(개)<input id="f-order-qty" type="number" min="1" max="9999" step="1" required inputmode="numeric"></label>
        <button type="submit" class="primary" id="order-btn">발주</button>
      </form>
      <p class="order-hint" id="order-who"></p>
      <p class="order-hint">발주하면 아래 발주 내역에 "발주" 상태로 남습니다. 물건이 도착하면 "입고 처리"를 눌러 재고에 더합니다. 직원과 관리자 모두 발주할 수 있습니다.</p>
    </section>

    <section class="card" aria-labelledby="list-title">
      <div class="list-head">
        <h2 id="list-title">메뉴 목록</h2>
        <span class="count" id="count"></span>
      </div>
      <div id="list-body"><div class="empty">불러오는 중입니다.</div></div>
    </section>

    <section class="card" aria-labelledby="orders-title">
      <div class="list-head">
        <h2 id="orders-title">발주 내역</h2>
        <span class="count" id="orders-count"></span>
      </div>
      <div id="order-body"><div class="empty">불러오는 중입니다.</div></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>

<script>
  const SUPABASE_URL = "https://hiuffyznumdigdxocgnx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_V-q98Dnfc78o0StvpnpAbg_BBm1kRG8"; // 공개용(publishable) 키
  const LOW_STOCK = 5; // 이 값 이하이면 빨간색

  const $ = id => document.getElementById(id);
  let menus = [];
  let orders = []; // 최근 발주 내역

  // 발주한 사람 (로그인한 이름). 직원과 관리자 모두 발주할 수 있고, "홍길동 (직원)", "관리자"처럼 기록된다.
  const WHO = (() => {
    try { return String(JSON.parse(sessionStorage.getItem("cafe-session")).name || "").trim().slice(0, 20); } catch { return ""; }
  })();

  // 로그인한 사람의 권한. 직원은 재고만 고칠 수 있고, 메뉴 추가·삭제와 가격 수정은 관리자만 한다.
  // (화면에서 막는 것일 뿐이며, 서버가 막아 주는 것은 아니다)
  const IS_ADMIN = (() => {
    try { return JSON.parse(sessionStorage.getItem("cafe-session")).role === "admin"; } catch { return false; }
  })();
  if (!IS_ADMIN) $("add-card").hidden = true;
  const ORDERER = WHO ? (IS_ADMIN ? WHO : `${WHO} (직원)`) : ""; // 발주 내역에 남는 이름
  $("menu-sub").textContent = IS_ADMIN
    ? `메뉴를 추가하고 가격과 재고를 고칩니다. 재고가 ${LOW_STOCK}개 이하이면 빨간색으로 표시됩니다.`
    : `직원은 재고만 고칠 수 있습니다. 메뉴 추가·삭제와 가격 수정은 관리자만 할 수 있습니다. 재고가 ${LOW_STOCK}개 이하이면 빨간색으로 표시됩니다.`;

  // Supabase REST 호출. path 예: "menus?select=*", "orders", "rpc/receive_order"
  async function rest(path, options = {}) {
    const res = await netFetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: {
        apikey: SUPABASE_KEY,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...(options.headers || {}),
      },
    });
    if (!res.ok) {
      const err = new Error(await res.text() || res.statusText);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // 메뉴 테이블 호출
  function api(query, options) {
    return rest(`menus${query}`, options);
  }

  // 인터넷 자체가 끊긴 경우에만 network 표시를 달아, 화면 코드에서 난 오류와 구분한다
  async function netFetch(url, options) {
    try {
      return await fetch(url, options);
    } catch (e) {
      if (e && e.name === "TimeoutError") e.status = 504; // 기다리는 시간을 넘긴 것은 인터넷 끊김이 아니다
      else e.network = true;
      throw e;
    }
  }

  // 오류를 사장님이 알아듣는 말로 바꾼다. what 은 하던 일의 어간("메뉴를 저장하"처럼 "지 못했습니다" 앞에 붙는 말)
  function friendly(e, what) {
    if (e && e.network) return `인터넷 연결이 불안정해 ${what}지 못했습니다. 연결을 확인하고 다시 눌러 주세요.`;
    if (e && e.gone) return `${what}지 못했습니다. 다른 곳에서 이미 지워졌거나 바뀐 것 같아 목록을 새로 불러왔습니다.`;
    if (e && e.status >= 500) return `서버가 잠시 불안정해 ${what}지 못했습니다. 잠시 뒤 다시 눌러 주세요.`;
    return `${what}지 못했습니다. 다시 눌러도 안 되면 알려 주세요.`;
  }

  let toastTimer;
  function toast(msg, isError) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.toggle("err", !!isError);
    el.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove("show"), 3500);
  }

  const isLow = stock => stock <= LOW_STOCK;

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function renderCategories() {
    const list = $("categories");
    list.replaceChildren(...[...new Set(menus.map(m => m.category))].map(c => el("option", { value: c })));
  }

  function renderRow(m) {
    const priceIn = el("input", { type: "number", min: 0, step: 1, value: m.price, inputMode: "numeric" });
    const stockIn = el("input", { type: "number", min: 0, step: 1, value: m.stock, inputMode: "numeric" });
    priceIn.setAttribute("aria-label", `${m.name} 가격`);
    stockIn.setAttribute("aria-label", `${m.name} 재고`);
    const saveBtn = el("button", { type: "button", textContent: "저장", disabled: true });
    const delBtn = el("button", { type: "button", className: "danger", textContent: "삭제" });
    delBtn.setAttribute("aria-label", `${m.name} 삭제`);
    if (!IS_ADMIN) {
      priceIn.readOnly = true; // 직원은 가격을 고칠 수 없고 삭제 버튼도 보이지 않는다
      delBtn.hidden = true;
    }
    // 이 메뉴를 발주하러 가는 바로가기: 위의 발주 칸에 메뉴를 골라 놓고 수량 칸으로 옮겨 간다
    const orderBtn = el("button", { type: "button", textContent: "발주" });
    orderBtn.setAttribute("aria-label", `${m.name} 발주하기`);
    orderBtn.addEventListener("click", () => {
      $("f-order-menu").value = String(m.id);
      $("order-card").scrollIntoView({ behavior: "smooth", block: "center" });
      $("f-order-qty").focus();
    });
    const badge = el("span", { className: "badge", textContent: "재고 부족" });
    const nameCell = el("td", { className: "name" }, m.name);
    const tr = el("tr", {},
      nameCell,
      el("td", { className: "cat", textContent: m.category }),
      el("td", { className: "num" }, priceIn),
      el("td", { className: "num stock-cell" }, stockIn),
      el("td", { className: "act" }, orderBtn, saveBtn, delBtn),
    );

    const parse = input => (input.value.trim() === "" ? NaN : Number(input.value));
    const valid = n => Number.isInteger(n) && n >= 0;

    function refresh() {
      const price = parse(priceIn), stock = parse(stockIn);
      const low = valid(stock) && isLow(stock);
      tr.classList.toggle("low", low);
      if (low && !badge.isConnected) nameCell.append(badge);
      if (!low) badge.remove();
      saveBtn.disabled = !(valid(price) && valid(stock) && (price !== m.price || stock !== m.stock));
      saveBtn.classList.toggle("primary", !saveBtn.disabled);
    }

    async function save() {
      const price = parse(priceIn), stock = parse(stockIn);
      if (!valid(price) || !valid(stock)) return;
      // 바뀐 칸만 보낸다. 화면을 열어 둔 사이 다른 곳에서 바뀐 값(예: 판매로 줄어든 재고)을 옛 값으로 덮어쓰지 않으려는 것
      const changes = {};
      if (price !== m.price) changes.price = price;
      if (stock !== m.stock) changes.stock = stock;
      if (!Object.keys(changes).length) return;
      saveBtn.disabled = true;
      try {
        const [row] = await api(`?id=eq.${m.id}`, { method: "PATCH", body: JSON.stringify(changes) });
        if (!row) throw Object.assign(new Error("menu not found"), { gone: true }); // 그 사이 지워진 메뉴
        m.price = row.price; m.stock = row.stock;
        priceIn.value = row.price; stockIn.value = row.stock; // 서버에 실제로 저장된 값을 보여 준다
        toast(`${m.name} 저장했습니다.`);
      } catch (e) {
        toast(friendly(e, `${m.name}의 가격과 재고를 저장하`), true);
        if (e.gone) load();
      }
      refresh();
    }

    async function remove() {
      if (!confirm(`'${m.name}' 메뉴를 삭제할까요?\n지난 판매 내역은 그대로 남습니다.`)) return;
      saveBtn.disabled = delBtn.disabled = true;
      try {
        await api(`?id=eq.${m.id}`, { method: "DELETE" });
        menus = menus.filter(x => x !== m);
        render();
        toast(`${m.name} 삭제했습니다.`);
      } catch (e) {
        toast(friendly(e, `${m.name} 메뉴를 삭제하`), true);
        delBtn.disabled = false;
        refresh();
      }
    }

    [priceIn, stockIn].forEach(i => {
      i.addEventListener("input", refresh);
      i.addEventListener("keydown", e => { if (e.key === "Enter" && !saveBtn.disabled) save(); });
    });
    saveBtn.addEventListener("click", save);
    delBtn.addEventListener("click", remove);
    refresh();
    return tr;
  }

  function render() {
    renderCategories();
    renderOrderMenus();
    const body = $("list-body");
    $("count").textContent = `${menus.length}개`;
    if (!menus.length) {
      body.replaceChildren(el("div", { className: "empty", textContent: IS_ADMIN ? "등록된 메뉴가 없습니다. 위에서 메뉴를 추가해 주세요." : "등록된 메뉴가 없습니다. 관리자에게 메뉴 등록을 요청해 주세요." }));
      return;
    }
    const head = el("tr", {},
      el("th", { textContent: "이름" }),
      el("th", { textContent: "분류" }),
      el("th", { className: "num", textContent: "가격(원)" }),
      el("th", { className: "num", textContent: "재고(개)" }),
      el("th"),
    );
    const table = el("table", {}, el("thead", {}, head), el("tbody", {}, ...menus.map(renderRow)));
    body.replaceChildren(el("div", { className: "table-scroll" }, table));
  }

  async function load() {
    try {
      menus = await api("?select=*&order=category.asc,name.asc", { headers: { Prefer: "" } });
      render();
    } catch (e) {
      const retry = el("button", { type: "button", textContent: "다시 불러오기" });
      retry.addEventListener("click", load);
      $("f-order-menu").replaceChildren(el("option", { value: "", textContent: "메뉴를 불러오지 못했습니다" }));
      $("list-body").replaceChildren(el("div", { className: "error" }, friendly(e, "메뉴 목록을 불러오"), el("br"), retry));
    }
  }

  $("add-form").addEventListener("submit", async e => {
    e.preventDefault();
    const name = $("f-name").value.trim(), category = $("f-category").value.trim();
    const price = Number($("f-price").value), stock = Number($("f-stock").value);
    if (!name || !category || !Number.isInteger(price) || price < 0 || !Number.isInteger(stock) || stock < 0) {
      return toast("이름과 분류를 적고, 가격과 재고는 0 이상의 숫자로 넣어 주세요.", true);
    }
    $("add-btn").disabled = true;
    try {
      await api("", { method: "POST", body: JSON.stringify({ name, category, price, stock }) });
      e.target.reset();
      toast(`${name} 추가했습니다.`);
      await load();
      $("f-name").focus();
    } catch (err) {
      toast(friendly(err, `${name} 메뉴를 추가하`), true);
    }
    $("add-btn").disabled = false;
  });

  /* ===== 재고 발주 ===== */
  // 발주하기 전에 어떤 이름으로 기록되는지 보여 준다
  $("order-who").textContent = ORDERER
    ? `발주자: ${ORDERER} — 로그인한 이름으로 발주 내역에 기록됩니다.`
    : "로그인한 이름을 찾을 수 없습니다. 로그아웃한 뒤 다시 로그인해 주세요.";
  if (!ORDERER) $("order-btn").disabled = true;
  const ORDER_STATUS = { "발주": "wait", "입고": "done", "취소": "cancel" };
  const whenText = iso => new Date(iso).toLocaleString("ko-KR", { timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });

  // 발주 메뉴 선택칸: 재고가 적은 메뉴가 눈에 띄게 재고를 같이 보여 준다
  function renderOrderMenus() {
    const sel = $("f-order-menu");
    const keep = sel.value;
    sel.replaceChildren(
      el("option", { value: "", textContent: menus.length ? "메뉴를 선택하세요" : "등록된 메뉴가 없습니다" }),
      ...menus.map(m => el("option", { value: m.id, textContent: `${m.name} · 재고 ${m.stock}개${isLow(m.stock) ? " (부족)" : ""}` })),
    );
    if (keep && menus.some(m => String(m.id) === keep)) sel.value = keep;
  }

  function renderOrders() {
    const pending = orders.filter(o => o.status === "발주").length;
    $("orders-count").textContent = pending ? `입고를 기다리는 발주 ${pending}건` : "";
    const body = $("order-body");
    if (!orders.length) {
      body.replaceChildren(el("div", { className: "empty", textContent: "아직 발주한 내역이 없습니다." }));
      return;
    }
    const head = el("tr", {},
      el("th", { textContent: "발주 시각" }),
      el("th", { textContent: "메뉴" }),
      el("th", { className: "num", textContent: "수량" }),
      el("th", { textContent: "발주한 사람" }),
      el("th", { textContent: "상태" }),
      el("th"),
    );
    const rows = orders.map(o => {
      const act = el("td", { className: "act" });
      if (o.status === "발주") {
        const receive = el("button", { type: "button", className: "primary", textContent: "입고 처리" });
        receive.setAttribute("aria-label", `${o.menu_name} ${o.quantity}개 입고 처리`);
        receive.addEventListener("click", () => receiveOrder(o, receive));
        const cancel = el("button", { type: "button", className: "danger", textContent: "취소" });
        cancel.setAttribute("aria-label", `${o.menu_name} 발주 취소`);
        cancel.addEventListener("click", () => cancelOrder(o, cancel));
        act.append(receive, cancel);
      } else if (o.status === "입고" && o.received_at) {
        act.append(el("span", { className: "when", textContent: `${whenText(o.received_at)} 입고` }));
      }
      return el("tr", {},
        el("td", { className: "when", textContent: whenText(o.ordered_at) }),
        el("td", { className: "name", textContent: o.menu_name }),
        el("td", { className: "num", textContent: `${o.quantity}개` }),
        el("td", { className: o.ordered_by ? "orderer" : "when", textContent: o.ordered_by || "기록 없음" }),
        el("td", {}, el("span", { className: `status ${ORDER_STATUS[o.status] || "cancel"}`, textContent: o.status })),
        act);
    });
    body.replaceChildren(el("div", { className: "table-scroll" },
      el("table", { className: "orders-table" }, el("thead", {}, head), el("tbody", {}, ...rows))));
  }

  async function loadOrders() {
    try {
      orders = await rest("orders?select=*&order=ordered_at.desc,id.desc&limit=30", { headers: { Prefer: "" } });
      renderOrders();
    } catch (e) {
      const retry = el("button", { type: "button", textContent: "다시 불러오기" });
      retry.addEventListener("click", loadOrders);
      $("order-body").replaceChildren(el("div", { className: "error" }, friendly(e, "발주 내역을 불러오"), el("br"), retry));
    }
  }

  $("order-form").addEventListener("submit", async e => {
    e.preventDefault();
    const m = menus.find(x => String(x.id) === $("f-order-menu").value);
    const qty = Number($("f-order-qty").value);
    if (!ORDERER) return toast("로그인한 이름을 찾을 수 없어 발주할 수 없습니다. 다시 로그인해 주세요.", true);
    if (!m) return toast("발주할 메뉴를 선택해 주세요.", true);
    if (!Number.isInteger(qty) || qty < 1 || qty > 9999) return toast("수량은 1개 이상 9999개 이하의 숫자로 넣어 주세요.", true);

    $("order-btn").disabled = true;
    try {
      await rest("orders", { method: "POST", body: JSON.stringify({ menu_id: m.id, menu_name: m.name, quantity: qty, ordered_by: ORDERER }) });
      $("f-order-qty").value = "";
      toast(`${m.name} ${qty}개를 발주했습니다. (발주자: ${ORDERER})`);
      await loadOrders();
    } catch (err) {
      toast(friendly(err, `${m.name} 발주를 하`), true);
    }
    $("order-btn").disabled = false;
  });

  // 입고 처리: 발주를 '입고'로 바꾸고 재고를 늘리는 일을 DB 함수가 한 번에 한다
  async function receiveOrder(o, btn) {
    if (!confirm(`'${o.menu_name}' ${o.quantity}개를 입고 처리할까요?\n재고가 ${o.quantity}개 늘어납니다.`)) return;
    btn.disabled = true;
    try {
      await rest("rpc/receive_order", { method: "POST", body: JSON.stringify({ p_order_id: o.id }) });
      toast(`${o.menu_name} ${o.quantity}개를 입고했습니다. 재고에 더했습니다.`);
    } catch (e) {
      const code = (/already_processed|order_not_found|menu_not_found/.exec(e.message) || [])[0];
      toast({
        already_processed: "이미 입고했거나 취소한 발주입니다. 목록을 새로 불러왔습니다.",
        order_not_found: "발주 내역을 찾을 수 없습니다. 목록을 새로 불러왔습니다.",
        menu_not_found: "이 메뉴가 지워져서 입고 처리를 할 수 없습니다. 발주를 취소해 주세요.",
      }[code] || friendly(e, `${o.menu_name} 입고 처리를 하`), true);
    }
    await Promise.all([load(), loadOrders()]);
  }

  async function cancelOrder(o, btn) {
    if (!confirm(`'${o.menu_name}' ${o.quantity}개 발주를 취소할까요?`)) return;
    btn.disabled = true;
    try {
      // 아직 '발주' 상태일 때만 취소된다. 그 사이 입고된 발주는 건드리지 않는다
      const rows = await rest(`orders?id=eq.${o.id}&status=eq.${encodeURIComponent("발주")}`, { method: "PATCH", body: JSON.stringify({ status: "취소" }) });
      toast(rows.length ? `${o.menu_name} 발주를 취소했습니다.` : "이미 입고했거나 취소한 발주입니다. 목록을 새로 불러왔습니다.", !rows.length);
    } catch (e) {
      toast(friendly(e, `${o.menu_name} 발주를 취소하`), true);
    }
    await loadOrders();
  }

  load();
  loadOrders();
</script>
</body>
</html>
