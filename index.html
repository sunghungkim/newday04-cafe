<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 공통 디자인 값 (Vapor UI 기준): 모든 페이지(sales/menu/reviews/promo)에 같은 값을 복사해 쓴다 */
  :root {
    --canvas: #FFFFFF;          /* 카드·메뉴 표면 */
    --canvas-200: #F7F7F7;      /* 페이지 배경 */
    --border: #C6C6C6;          /* 1px 헤어라인 */
    --hover: #F7F7F7;
    --text: #262626;
    --text-normal: #4C4C4C;
    --text-hint: #5D5D5D;
    --primary: #2A72E5;
    --primary-fg: #0957C8;
    --primary-soft: #EFF8FF;
    --success: #058765;
    --warning: #D34701;
    --danger: #DA3944;
    --danger-fg: #BB1225;
    --danger-soft: #FFF5F4;
    --bar-muted: #8DCDFF;       /* 그래프에서 강조하지 않는 막대 */
    --radius: 8px;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / .20);
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #232323;
      --canvas-200: #282828;
      --border: #474747;
      --hover: #363636;
      --text: #FAFAFA;
      --text-normal: #BEBEBE;
      --text-hint: #A7A7A7;
      --primary: #368AED;
      --primary-fg: #56ACF9;
      --primary-soft: #001286;
      --success: #46B993;
      --warning: #F58A56;
      --danger: #F14F5A;
      --danger-fg: #FD8283;
      --danger-soft: #590000;
      --bar-muted: #0E5ACB;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: var(--canvas-200);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 24px;
  }

  /* 왼쪽 메뉴 */
  .sidebar {
    width: 232px;
    flex-shrink: 0;
    background: var(--canvas);
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .brand {
    font-size: 20px;
    line-height: 30px;
    font-weight: 700;
    letter-spacing: -0.2px;
    padding: 0 12px 24px;
  }
  .brand small {
    display: block;
    font-size: 14px;
    line-height: 22px;
    font-weight: 400;
    letter-spacing: 0;
    color: var(--text-hint);
  }
  .nav-btn {
    font: inherit;
    font-weight: 500;
    height: 48px;
    text-align: left;
    padding: 0 16px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text-normal);
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--hover); }
  .nav-btn.active { background: var(--primary-soft); color: var(--primary-fg); font-weight: 700; }
  .nav-btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

  /* 가운데 화면 */
  .stage { flex: 1; position: relative; min-width: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--canvas-200); }
  .coming {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .coming.show { display: flex; }
  .coming-card {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 40px 48px;
    text-align: center;
  }
  .coming-card small { font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .coming-card strong {
    display: block;
    font-size: 24px;
    line-height: 36px;
    font-weight: 700;
    letter-spacing: -0.3px;
    margin: 2px 0 4px;
  }
  .coming-card span { font-size: 14px; line-height: 22px; color: var(--text-normal); }

  /* 홈 (숫자 카드 + 7일 매출 그래프) */
  .home {
    position: absolute;
    inset: 0;
    display: none;
    overflow: auto;
    padding: 32px;
  }
  .home.show { display: block; }
  .home-inner { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
  .home-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; }
  .home-head h1 { margin: 0; font-size: 24px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px; }
  .home-head p { margin: 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .btn {
    font: inherit; font-weight: 500; height: 40px; padding: 0 20px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--canvas); color: var(--text-normal); cursor: pointer; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { background: var(--hover); }
  .btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  .btn:disabled { opacity: .5; cursor: default; }

  #home-body { display: flex; flex-direction: column; gap: 24px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 20px;
  }
  .kpi .label { font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .kpi .value { font-size: clamp(22px, 2.9vw, 32px); line-height: 48px; font-weight: 700; letter-spacing: -0.4px; margin: 2px 0; white-space: nowrap; }
  .kpi .value small { font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: 0; color: var(--text-hint); margin-left: 2px; }
  .kpi .note { font-size: 14px; line-height: 22px; color: var(--text-hint); min-height: 22px; }
  .kpi.alert .value, .kpi.alert .note { color: var(--danger-fg); }

  .chart-card h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: -0.1px; }
  .chart-card .sub { margin: 0 0 20px; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .chart { margin-left: 48px; }
  .plot { position: relative; height: 220px; }
  .grid-line { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--border); opacity: .6; }
  .grid-line.base { opacity: 1; }
  .tick { position: absolute; right: calc(100% + 8px); transform: translateY(50%); font-size: 12px; line-height: 18px; color: var(--text-hint); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
  .col { position: relative; display: flex; align-items: flex-end; justify-content: center; outline: none; }
  .bar { width: 24px; max-width: 60%; background: var(--bar-muted); border-radius: 4px 4px 0 0; min-height: 2px; }
  .col.today .bar { background: var(--primary); }
  .col:hover .bar, .col:focus-visible .bar { background: var(--primary-fg); }
  .col:focus-visible { box-shadow: inset 0 0 0 2px var(--primary); border-radius: 4px; }
  .bar-label { position: absolute; left: 50%; transform: translateX(-50%); font-size: 12px; line-height: 18px; color: var(--text-normal); white-space: nowrap; padding-bottom: 4px; font-variant-numeric: tabular-nums; }
  .col.today .bar-label { font-weight: 700; color: var(--text); }
  .xlabels { display: grid; grid-template-columns: repeat(7, 1fr); margin-top: 8px; }
  .xlabel { text-align: center; font-size: 12px; line-height: 18px; color: var(--text-hint); }
  .xlabel.today { font-weight: 700; color: var(--text); }
  .tip {
    position: absolute; z-index: 2; pointer-events: none; display: none;
    padding: 8px 12px; border-radius: var(--radius);
    background: var(--text); color: var(--canvas);
    font-size: 13px; line-height: 20px; white-space: nowrap; box-shadow: var(--shadow-sm);
  }
  .tip.show { display: block; }
  details.data-table { margin-top: 20px; font-size: 14px; }
  details.data-table summary { cursor: pointer; color: var(--text-hint); }
  details.data-table table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  details.data-table th, details.data-table td { padding: 6px 8px 6px 0; border-bottom: 1px solid var(--border); text-align: right; font-variant-numeric: tabular-nums; }
  details.data-table th:first-child, details.data-table td:first-child { text-align: left; }
  details.data-table th { font-weight: 500; color: var(--text-hint); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  .btn.primary:hover:not(:disabled) { background: var(--primary-fg); border-color: var(--primary-fg); }
  .brief-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .brief-head h2 { margin: 0; font-size: 18px; line-height: 26px; font-weight: 700; letter-spacing: -0.1px; }
  .brief-head p { margin: 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .brief-out { margin-top: 16px; }
  .brief-out:empty { display: none; }
  .brief-lines { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px; }
  .brief-lines li { display: flex; gap: 12px; }
  .brief-lines .no {
    flex: none; width: 24px; height: 24px; border-radius: 50%;
    background: var(--primary-soft); color: var(--primary-fg);
    font-size: 14px; line-height: 24px; text-align: center; font-weight: 700;
  }
  .brief-msg { color: var(--text-normal); }
  .brief-msg.err { color: var(--danger-fg); }
  .home-error { text-align: center; padding: 48px 0; color: var(--danger-fg); }
  .home-error .btn { margin-top: 12px; }

  /* 좁은 화면: 메뉴를 위로 */
  @media (max-width: 640px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--border); }
    .brand { display: none; }
    .nav-btn { white-space: nowrap; }
    .home { padding: 16px; }
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .kpi .value { font-size: 24px; line-height: 36px; }
    .brief-head { flex-direction: column; align-items: stretch; }
    .chart { margin-left: 40px; }
  }
  @media (max-width: 900px) {
    .kpis { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
  <nav class="sidebar" aria-label="메인 메뉴">
    <div class="brand">골목카페<small>운영 대시보드</small></div>
    <button class="nav-btn" data-page="home">홈</button>
    <button class="nav-btn" data-page="sales">매출</button>
    <button class="nav-btn" data-page="menu">메뉴</button>
    <button class="nav-btn" data-page="reviews">리뷰</button>
    <button class="nav-btn" data-page="promo">홍보</button>
  </nav>

  <main class="stage">
    <section id="home" class="home" aria-label="홈">
      <div class="home-inner">
        <div class="home-head">
          <div>
            <h1>오늘 장사</h1>
            <p id="home-date"></p>
          </div>
          <button type="button" class="btn" id="home-refresh">새로고침</button>
        </div>
        <div id="home-body"><div class="home-error" style="color:var(--text-hint)">불러오는 중입니다.</div></div>
      </div>
    </section>
    <iframe id="frame" title="내용 화면"></iframe>
    <div id="coming" class="coming" role="status">
      <div class="coming-card">
        <small>Coming Soon</small>
        <strong>준비중</strong>
        <span id="coming-name"></span>
      </div>
    </div>
  </main>

<script>
  // 메뉴 → 가운데에 열 파일. 홈은 이 파일 안의 화면(file 없음)이다.
  const PAGES = {
    home:    { label: "홈",  file: null },
    sales:   { label: "매출", file: "sales.html" },
    menu:    { label: "메뉴", file: "menu.html" },
    reviews: { label: "리뷰", file: "reviews.html" },
    promo:   { label: "홍보", file: "promo.html" },
  };

  const frame = document.getElementById("frame");
  const homeEl = document.getElementById("home");
  const coming = document.getElementById("coming");
  const comingName = document.getElementById("coming-name");
  const buttons = document.querySelectorAll(".nav-btn");
  let token = 0; // 빠르게 연속 클릭해도 마지막 선택만 반영

  function showComing(label) {
    homeEl.classList.remove("show");
    frame.removeAttribute("src");
    frame.style.visibility = "hidden";
    comingName.textContent = label + " 화면은 곧 준비됩니다.";
    coming.classList.add("show");
  }

  function showFrame(file) {
    homeEl.classList.remove("show");
    coming.classList.remove("show");
    frame.style.visibility = "visible";
    frame.src = file;
  }

  async function open(key) {
    if (!PAGES[key]) key = "home";
    const { label, file } = PAGES[key];
    const mine = ++token;

    buttons.forEach(b => b.classList.toggle("active", b.dataset.page === key));
    history.replaceState(null, "", "#" + key);

    if (key === "home") return showHome();
    if (!file) return showComing(label);

    // 파일이 있는지 먼저 확인 (없으면 준비중). file:// 로 열면 확인이 불가능해 그냥 연다.
    try {
      const res = await fetch(file, { method: "HEAD", cache: "no-store" });
      if (mine !== token) return;
      res.ok ? showFrame(file) : showComing(label);
    } catch (e) {
      if (mine !== token) return;
      location.protocol === "file:" ? showFrame(file) : showComing(label);
    }
  }

  /* ===== 홈: Supabase 숫자 카드 + 최근 7일 매출 그래프 (날짜는 모두 한국 시간 기준) ===== */
  const SUPABASE_URL = "https://hiuffyznumdigdxocgnx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_V-q98Dnfc78o0StvpnpAbg_BBm1kRG8"; // 공개용(publishable) 키
  const LOW_STOCK = 5; // 이 값 이하이면 재고 부족
  const WEEKDAYS = "일월화수목금토";
  const kstFormat = new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Seoul", year: "numeric", month: "2-digit", day: "2-digit" });
  const won = n => Number(n).toLocaleString("ko-KR") + "원";
  const $ = id => document.getElementById(id);
  let homeToken = 0;

  async function api(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY } });
    if (!res.ok) throw new Error(await res.text() || res.statusText);
    return res.json();
  }

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  // 한국 시간 기준 날짜 문자열 "YYYY-MM-DD"
  function kstDate(date) {
    const p = Object.fromEntries(kstFormat.formatToParts(date).map(x => [x.type, x.value]));
    return `${p.year}-${p.month}-${p.day}`;
  }

  // 오늘을 포함한 최근 7일 (오래된 날 → 오늘)
  function lastSevenDays() {
    const [y, m, d] = kstDate(new Date()).split("-").map(Number);
    return Array.from({ length: 7 }, (_, i) => {
      const dt = new Date(Date.UTC(y, m - 1, d - (6 - i)));
      return { key: dt.toISOString().slice(0, 10), month: dt.getUTCMonth() + 1, day: dt.getUTCDate(), weekday: WEEKDAYS[dt.getUTCDay()], amount: 0, count: 0 };
    });
  }

  function kpi(label, value, unit, note, alert) {
    const v = el("div", { className: "value" }, value);
    if (unit) v.append(el("small", { textContent: unit }));
    return el("div", { className: "card kpi" + (alert ? " alert" : "") },
      el("div", { className: "label", textContent: label }), v, el("div", { className: "note", textContent: note }));
  }

  function compact(v) {
    return v >= 10000 ? `${+(v / 10000).toFixed(1)}만` : v.toLocaleString("ko-KR");
  }

  // 눈금: 0부터 깔끔한 간격으로 최대 5개
  function scale(max) {
    if (max <= 0) return { top: 10000, step: 10000 };
    const rough = max / 4, pow = 10 ** Math.floor(Math.log10(rough));
    const step = [1, 2, 2.5, 5, 10].map(f => f * pow).find(s => s >= rough);
    return { top: step * Math.ceil(max / step), step };
  }

  function renderChart(days) {
    const max = Math.max(...days.map(d => d.amount));
    const { top, step } = scale(max);
    const plot = el("div", { className: "plot" });
    for (let v = 0; v <= top; v += step) {
      plot.append(el("div", { className: "grid-line" + (v === 0 ? " base" : ""), style: `bottom:${(v / top) * 100}%` }),
        el("div", { className: "tick", textContent: v === 0 ? "0" : compact(v), style: `bottom:${(v / top) * 100}%` }));
    }
    const tip = el("div", { className: "tip", role: "tooltip" });
    const cols = el("div", { className: "cols" });
    days.forEach((d, i) => {
      const pct = (d.amount / top) * 100;
      const isToday = i === days.length - 1;
      const text = `${d.month}월 ${d.day}일(${d.weekday}) · ${won(d.amount)} · ${d.count}건`;
      const col = el("div", { className: "col" + (isToday ? " today" : ""), tabIndex: 0 });
      col.setAttribute("role", "img");
      col.setAttribute("aria-label", text);
      const bar = el("div", { className: "bar", style: `height:${pct}%` });
      col.append(bar);
      // 값 라벨은 오늘과 최고 매출일에만 붙인다
      if (d.amount > 0 && (isToday || d.amount === max)) {
        col.append(el("div", { className: "bar-label", textContent: d.amount.toLocaleString("ko-KR"), style: `bottom:${pct}%` }));
      }
      const show = () => {
        tip.textContent = text;
        tip.style.left = `${((i + 0.5) / days.length) * 100}%`;
        tip.style.bottom = `calc(${pct}% + 28px)`;
        tip.style.transform = `translateX(${i === 0 ? "-15%" : i === days.length - 1 ? "-85%" : "-50%"})`;
        tip.classList.add("show");
      };
      const hide = () => tip.classList.remove("show");
      col.addEventListener("mouseenter", show); col.addEventListener("focus", show);
      col.addEventListener("mouseleave", hide); col.addEventListener("blur", hide);
      cols.append(col);
    });
    plot.append(cols, tip);

    const xlabels = el("div", { className: "xlabels" }, ...days.map((d, i) =>
      el("div", { className: "xlabel" + (i === days.length - 1 ? " today" : "") },
        i === days.length - 1 ? "오늘" : `${d.month}/${d.day}`, el("br"), d.weekday)));

    const table = el("details", { className: "data-table" }, el("summary", { textContent: "표로 보기" }),
      el("table", {},
        el("thead", {}, el("tr", {}, el("th", { textContent: "날짜" }), el("th", { textContent: "매출" }), el("th", { textContent: "주문수" }))),
        el("tbody", {}, ...days.map(d => el("tr", {},
          el("td", { textContent: `${d.month}월 ${d.day}일(${d.weekday})` }),
          el("td", { textContent: won(d.amount) }),
          el("td", { textContent: `${d.count}건` }))))));

    const total = days.reduce((s, d) => s + d.amount, 0);
    return el("section", { className: "card chart-card" },
      el("h2", { textContent: "최근 7일 매출" }),
      el("p", { className: "sub", textContent: `7일 합계 ${won(total)}` }),
      el("div", { className: "chart" }, plot, xlabels), table);
  }

  // 오늘 브리핑: 홈 카드 숫자 4개와 7일 매출을 cafe-ai 의 brief 로 보내 세 줄을 받는다
  function briefCard(payload) {
    const btn = el("button", { type: "button", className: "btn primary", textContent: "오늘 브리핑" });
    const out = el("div", { className: "brief-out", ariaLive: "polite" });
    out.setAttribute("aria-live", "polite");

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "브리핑 만드는 중...";
      out.replaceChildren(el("div", { className: "brief-msg", textContent: "숫자를 정리하고 있습니다. 10초 안팎 걸립니다." }));
      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/cafe-ai`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ type: "brief", today: payload }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "브리핑을 만들지 못했습니다.");
        out.replaceChildren(el("ol", { className: "brief-lines" },
          ...data.lines.map((line, i) => el("li", {}, el("span", { className: "no", textContent: String(i + 1) }), el("span", { textContent: line })))));
        btn.textContent = "다시 브리핑";
      } catch (e) {
        out.replaceChildren(el("div", { className: "brief-msg err", textContent: e.message || "브리핑을 만들지 못했습니다. 다시 시도해 주세요." }));
        btn.textContent = "오늘 브리핑";
      }
      btn.disabled = false;
    });

    return el("section", { className: "card" },
      el("div", { className: "brief-head" },
        el("div", {}, el("h2", { textContent: "오늘 브리핑" }), el("p", { textContent: "위 숫자와 최근 7일 매출을 AI가 세 줄로 정리합니다." })),
        btn),
      out);
  }

  async function showHome() {
    coming.classList.remove("show");
    frame.removeAttribute("src");
    frame.style.visibility = "hidden";
    homeEl.classList.add("show");
    const mine = ++homeToken;
    const body = $("home-body"), refresh = $("home-refresh");

    const today = kstDate(new Date());
    $("home-date").textContent = `${today.replaceAll("-", ".")} (${WEEKDAYS[new Date(today + "T00:00:00Z").getUTCDay()]}) 기준 · 한국 시간`;
    refresh.disabled = true;

    try {
      const days = lastSevenDays();
      const since = new Date(`${days[0].key}T00:00:00+09:00`).toISOString();
      const [sales, reviews, menus] = await Promise.all([
        api(`sales?select=amount,sold_at&sold_at=gte.${encodeURIComponent(since)}`),
        api("reviews?select=rating"),
        api("menus?select=name,stock&order=stock.asc"),
      ]);
      if (mine !== homeToken) return;

      const byDay = Object.fromEntries(days.map(d => [d.key, d]));
      sales.forEach(s => {
        const d = byDay[kstDate(new Date(s.sold_at))];
        if (d) { d.amount += s.amount; d.count += 1; }
      });
      const todayRow = days[6], yesterday = days[5];
      const avg = reviews.length ? reviews.reduce((s, r) => s + r.rating, 0) / reviews.length : null;
      const low = menus.filter(m => m.stock <= LOW_STOCK);
      const briefPayload = {
        revenue: todayRow.amount,
        orders: todayRow.count,
        avgRating: avg === null ? undefined : Number(avg.toFixed(1)),
        lowStockCount: low.length,
        lowStockMenus: low.map(m => m.name),
        yesterdayRevenue: yesterday.amount,
        yesterdayOrders: yesterday.count,
        weekly: days.map(d => ({ date: `${d.month}/${d.day}`, revenue: d.amount })),
      };

      body.replaceChildren(
        el("div", { className: "kpis" },
          kpi("오늘 매출", won(todayRow.amount).replace("원", ""), "원", `어제 ${won(yesterday.amount)}`),
          kpi("오늘 주문수", String(todayRow.count), "건", `어제 ${yesterday.count}건`),
          kpi("평균 별점", avg === null ? "-" : avg.toFixed(1), avg === null ? "" : "/ 5", avg === null ? "리뷰가 없습니다" : `리뷰 ${reviews.length}개`),
          kpi("재고 부족 메뉴", String(low.length), "개", low.length ? low.map(m => m.name).join(", ") : `재고 ${LOW_STOCK}개 이하 없음`, low.length > 0)),
        briefCard(briefPayload),
        renderChart(days));
    } catch (e) {
      if (mine !== homeToken) return;
      const retry = el("button", { type: "button", className: "btn", textContent: "다시 불러오기" });
      retry.addEventListener("click", showHome);
      body.replaceChildren(el("div", { className: "home-error" }, "데이터를 불러오지 못했습니다.", el("br"), retry));
    }
    if (mine === homeToken) refresh.disabled = false;
  }

  $("home-refresh").addEventListener("click", showHome);

  buttons.forEach(b => b.addEventListener("click", () => open(b.dataset.page)));
  open(location.hash.slice(1) || "home");
</script>
</body>
</html>
