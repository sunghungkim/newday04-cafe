<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>골목카페 대시보드</title>
<style>
  /* 공통 디자인 값: 모든 페이지(sales/menu/reviews/promo)에 같은 값을 복사해 쓴다 */
  :root {
    --bg: #faf5ee;
    --surface: #ffffff;
    --text: #3b2a20;
    --muted: #8a7566;
    --primary: #8b5a3c;
    --primary-soft: #f1e4d6;
    --line: #e8dccd;
    --radius: 14px;
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 18px;
  }

  /* 왼쪽 메뉴 */
  .sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--line);
    padding: 24px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    padding: 4px 12px 20px;
    color: var(--primary);
  }
  .brand small {
    display: block;
    font-size: 13px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 2px;
  }
  .nav-btn {
    font: inherit;
    text-align: left;
    padding: 14px 16px;
    border: 0;
    border-radius: var(--radius);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .nav-btn:hover { background: var(--primary-soft); }
  .nav-btn.active { background: var(--primary); color: #fff; font-weight: 700; }
  .nav-btn:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }

  /* 가운데 화면 */
  .stage { flex: 1; position: relative; min-width: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  .coming {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 8px;
    color: var(--muted);
    text-align: center;
  }
  .coming.show { display: flex; }
  .coming strong { font-size: 32px; color: var(--text); }

  /* 좁은 화면: 메뉴를 위로 */
  @media (max-width: 640px) {
    body { flex-direction: column; font-size: 16px; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; padding: 10px; border-right: 0; border-bottom: 1px solid var(--line); }
    .brand { display: none; }
    .nav-btn { white-space: nowrap; padding: 10px 14px; }
  }
</style>
</head>
<body>
  <nav class="sidebar" aria-label="메인 메뉴">
    <div class="brand">골목카페<small>운영 대시보드</small></div>
    <button class="nav-btn" data-page="home">홈</button>
    <button class="nav-btn" data-page="sales">매출</button>
    <button class="nav-btn" data-page="menu">메뉴</button>
    <button class="nav-btn" data-page="reviews">리뷰</button>
    <button class="nav-btn" data-page="promo">홍보</button>
  </nav>

  <main class="stage">
    <iframe id="frame" title="내용 화면"></iframe>
    <div id="coming" class="coming" role="status">
      <strong>준비중</strong>
      <span id="coming-name"></span>
    </div>
  </main>

<script>
  // 메뉴 → 가운데에 열 파일. 홈은 아직 별도 화면이 없어 null(준비중).
  const PAGES = {
    home:    { label: "홈",  file: null },
    sales:   { label: "매출", file: "sales.html" },
    menu:    { label: "메뉴", file: "menu.html" },
    reviews: { label: "리뷰", file: "reviews.html" },
    promo:   { label: "홍보", file: "promo.html" },
  };

  const frame = document.getElementById("frame");
  const coming = document.getElementById("coming");
  const comingName = document.getElementById("coming-name");
  const buttons = document.querySelectorAll(".nav-btn");
  let token = 0; // 빠르게 연속 클릭해도 마지막 선택만 반영

  function showComing(label) {
    frame.removeAttribute("src");
    frame.style.visibility = "hidden";
    comingName.textContent = label + " 화면은 곧 만들어져요";
    coming.classList.add("show");
  }

  function showFrame(file) {
    coming.classList.remove("show");
    frame.style.visibility = "visible";
    frame.src = file;
  }

  async function open(key) {
    if (!PAGES[key]) key = "home";
    const { label, file } = PAGES[key];
    const mine = ++token;

    buttons.forEach(b => b.classList.toggle("active", b.dataset.page === key));
    history.replaceState(null, "", "#" + key);

    if (!file) return showComing(label);

    // 파일이 있는지 먼저 확인 (없으면 준비중). file:// 로 열면 확인이 불가능해 그냥 연다.
    try {
      const res = await fetch(file, { method: "HEAD", cache: "no-store" });
      if (mine !== token) return;
      res.ok ? showFrame(file) : showComing(label);
    } catch (e) {
      if (mine !== token) return;
      location.protocol === "file:" ? showFrame(file) : showComing(label);
    }
  }

  buttons.forEach(b => b.addEventListener("click", () => open(b.dataset.page)));
  open(location.hash.slice(1) || "home");
</script>
</body>
</html>
