<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리뷰</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  /* 공통 디자인 값 (index.html의 :root 와 같은 값) */
  :root {
    --canvas: #FFFFFF;
    --canvas-200: #F7F7F7;
    --border: #C6C6C6;
    --hover: #F7F7F7;
    --text: #262626;
    --text-normal: #4C4C4C;
    --text-hint: #5D5D5D;
    --primary: #2A72E5;
    --primary-fg: #0957C8;
    --primary-soft: #EFF8FF;
    --success: #058765;
    --success-soft: #EDFAF4;
    --warning: #D34701;
    --danger: #DA3944;
    --danger-fg: #BB1225;
    --danger-soft: #FFF5F4;
    --star: #FBBD05;
    --bar-muted: #8DCDFF;
    --radius: 8px;
    --shadow-sm: 0 1px 3px rgb(0 0 0 / .20);
    --font: "Pretendard", "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --canvas: #232323;
      --canvas-200: #282828;
      --border: #474747;
      --hover: #363636;
      --text: #FAFAFA;
      --text-normal: #BEBEBE;
      --text-hint: #A7A7A7;
      --primary: #368AED;
      --primary-fg: #56ACF9;
      --primary-soft: #001286;
      --success: #46B993;
      --success-soft: #003016;
      --warning: #F58A56;
      --danger: #F14F5A;
      --danger-fg: #FD8283;
      --danger-soft: #590000;
      --star: #F4B402;
      --bar-muted: #0E5ACB;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px;
    background: var(--canvas-200);
    color: var(--text);
    font-family: var(--font);
    font-size: 16px;
    line-height: 24px;
  }
  .wrap { max-width: 880px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

  h1 { margin: 0; font-size: 24px; line-height: 36px; font-weight: 700; letter-spacing: -0.3px; }
  .sub { margin: 0; font-size: 14px; line-height: 22px; color: var(--text-hint); }

  .summary { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .summary strong { color: var(--text); font-weight: 700; }

  .list { display: flex; flex-direction: column; gap: 16px; }
  .card {
    background: var(--canvas);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    padding: 24px;
  }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .stars { font-size: 18px; letter-spacing: 1px; color: var(--star); line-height: 24px; }
  .stars .off { color: var(--border); }
  .date { font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .spacer { flex: 1; }
  .content { margin: 12px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  .badge {
    display: inline-block; padding: 0 8px; border-radius: 4px; border: 1px solid;
    font-size: 12px; line-height: 18px; font-weight: 700;
  }
  .badge.good { color: var(--success); background: var(--success-soft); border-color: var(--success); }
  .badge.normal { color: var(--text-normal); background: var(--canvas-200); border-color: var(--border); }
  .badge.bad { color: var(--danger-fg); background: var(--danger-soft); border-color: var(--danger); }

  .reply {
    margin-top: 16px; padding: 12px 16px;
    background: var(--canvas-200); border-radius: var(--radius);
  }
  .reply .label { font-size: 14px; line-height: 22px; font-weight: 500; color: var(--text-hint); }
  .reply p { margin: 4px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .reply .err { color: var(--danger-fg); }

  button {
    font: inherit; font-weight: 500; height: 36px; padding: 0 16px;
    border-radius: var(--radius); border: 1px solid var(--border);
    background: var(--canvas); color: var(--text-normal); cursor: pointer; white-space: nowrap;
  }
  button:hover:not(:disabled) { background: var(--hover); }
  button:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--primary-fg); border-color: var(--primary-fg); }

  /* 쪽 이동 */
  .pager { display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }
  .pager button { min-width: 36px; padding: 0 12px; }
  .pager button[aria-current="page"] { background: var(--primary-soft); border-color: var(--primary); color: var(--primary-fg); font-weight: 700; }
  .pager .gap { color: var(--text-hint); padding: 0 4px; }
  .pager-info { margin: 0; text-align: center; font-size: 14px; line-height: 22px; color: var(--text-hint); }
  .pager:empty, .pager-info:empty { display: none; }

  .empty, .error { padding: 48px 0; text-align: center; color: var(--text-hint); }
  .error { color: var(--danger-fg); }
  .error button { margin-top: 12px; height: 40px; padding: 0 20px; }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%);
    max-width: calc(100% - 32px);
    padding: 12px 20px; border-radius: var(--radius);
    background: var(--text); color: var(--canvas);
    font-size: 14px; line-height: 22px; box-shadow: var(--shadow-sm);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.err { background: var(--danger-fg); color: #fff; }

  @media (max-width: 720px) {
    body { padding: 16px; }
    .card { padding: 16px; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>리뷰</h1>
      <p class="sub">"AI 분석"을 누르면 감정과 사장님 답글 초안을 만들어 저장합니다. 답글은 읽어 보고 고쳐서 쓰세요.</p>
    </header>

    <div class="summary" id="summary" aria-live="polite"></div>
    <div class="list" id="list"><div class="empty">불러오는 중입니다.</div></div>
    <nav class="pager" id="pager" aria-label="리뷰 쪽 이동"></nav>
    <p class="pager-info" id="pager-info" aria-live="polite"></p>
  </div>
  <div id="toast" class="toast" role="status"></div>

<script>
  const SUPABASE_URL = "https://hiuffyznumdigdxocgnx.supabase.co";
  const SUPABASE_KEY = "sb_publishable_V-q98Dnfc78o0StvpnpAbg_BBm1kRG8"; // 공개용(publishable) 키
  const AI_URL = `${SUPABASE_URL}/functions/v1/cafe-ai`;
  const SENTIMENT_CLASS = { "좋음": "good", "보통": "normal", "아쉬움": "bad" };

  const PAGE_SIZE = 5; // 한 쪽에 보여 줄 리뷰 수

  const $ = id => document.getElementById(id);
  let reviews = [];      // 지금 쪽의 리뷰
  let page = 1;          // 지금 쪽 (1부터)
  let total = 0;         // 전체 리뷰 수
  let analyzedTotal = 0; // 분석을 마친 전체 리뷰 수
  let loadingPage = false;

  function el(tag, props = {}, ...children) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  let toastTimer;
  function toast(msg, isError) {
    const t = $("toast");
    t.textContent = msg;
    t.classList.toggle("err", !!isError);
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
  }

  async function db(path, options = {}) {
    const res = await netFetch(`${SUPABASE_URL}/rest/v1/${path}`, {
      ...options,
      headers: { apikey: SUPABASE_KEY, "Content-Type": "application/json", Prefer: "return=representation", ...(options.headers || {}) },
    });
    if (!res.ok) {
      const err = new Error(await res.text() || res.statusText);
      err.status = res.status;
      throw err;
    }
    return res.json();
  }

  // 목록과 전체 개수를 함께 받는다. 개수는 응답 머리글 Content-Range("0-4/40")의 슬래시 뒤에 들어 있다
  async function dbList(path) {
    const res = await netFetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY, Prefer: "count=exact" } });
    if (!res.ok) {
      const err = new Error(await res.text() || res.statusText);
      err.status = res.status;
      throw err;
    }
    const count = Number((res.headers.get("Content-Range") || "").split("/")[1]);
    return { rows: await res.json(), total: Number.isFinite(count) ? count : null };
  }

  // 인터넷 자체가 끊긴 경우에만 network 표시를 달아, 화면 코드에서 난 오류와 구분한다
  async function netFetch(url, options) {
    try {
      return await fetch(url, options);
    } catch (e) {
      e.network = true;
      throw e;
    }
  }

  // 오류를 사장님이 알아듣는 말로 바꾼다. what 은 하던 일의 어간("리뷰를 불러오"처럼 "지 못했습니다" 앞에 붙는 말)
  function friendly(e, what) {
    if (e && e.network) return `인터넷 연결이 불안정해 ${what}지 못했습니다. 연결을 확인하고 다시 눌러 주세요.`;
    if (e && e.gone) return `${what}지 못했습니다. 이 리뷰가 다른 곳에서 이미 지워진 것 같아 목록을 새로 불러왔습니다.`;
    if (e && e.status >= 500) return `서버가 잠시 불안정해 ${what}지 못했습니다. 잠시 뒤 다시 눌러 주세요.`;
    return `${what}지 못했습니다. 다시 눌러도 안 되면 알려 주세요.`;
  }

  // AI 기능(cafe-ai)의 오류. 상태 번호별로 무슨 일인지와 할 일을 알려 준다
  function aiFriendly(e, what) {
    if (e && e.network) return `인터넷 연결이 불안정해 ${what}지 못했습니다. 연결을 확인하고 다시 눌러 주세요.`;
    switch (e && e.status) {
      case 400: return "이 리뷰는 AI로 분석할 수 없습니다. 글이 너무 길거나 비어 있는지 확인해 주세요.";
      case 429: return "오늘 쓸 수 있는 AI 무료 사용량을 모두 썼습니다. 잠시 뒤나 내일 다시 눌러 주세요.";
      case 500: return "AI 기능에 문제가 생겨 지금은 쓸 수 없습니다. 잠시 뒤에도 안 되면 알려 주세요.";
      case 502: return "AI가 이번에는 답을 제대로 만들지 못했습니다. 한 번 더 눌러 주세요.";
      case 504: return "AI 응답이 너무 오래 걸립니다. 잠시 뒤 다시 눌러 주세요.";
      default: return `${what}지 못했습니다. 잠시 뒤 다시 눌러 주세요.`;
    }
  }

  // cafe-ai 의 review: 감정(좋음/보통/아쉬움)과 답글 초안을 받는다
  async function analyze(review) {
    const res = await netFetch(AI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type: "review", rating: review.rating, content: review.content }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error || "analyze failed"), { status: res.status });
    if (!data.sentiment || !data.reply) throw Object.assign(new Error("empty analysis"), { status: 502 });
    return data;
  }

  const formatDate = iso => new Date(iso).toLocaleString("ko-KR", {
    timeZone: "Asia/Seoul", month: "long", day: "numeric", hour: "numeric", minute: "2-digit",
  });

  function renderSummary() {
    $("summary").replaceChildren(
      el("span", {}, "전체 ", el("strong", { textContent: `${total}개` })),
      el("span", {}, "분석함 ", el("strong", { textContent: `${analyzedTotal}개` })),
      el("span", {}, "분석 전 ", el("strong", { textContent: `${Math.max(0, total - analyzedTotal)}개` })),
    );
  }

  // 1 … 4 [5] 6 … 20 처럼 처음·끝과 지금 쪽 주변만 보여 준다 (7쪽 이하면 모두)
  function pageNumbers(current, last) {
    if (last <= 7) return Array.from({ length: last }, (_, i) => i + 1);
    const nums = [...new Set([1, last, current - 1, current, current + 1])].filter(n => n >= 1 && n <= last).sort((a, b) => a - b);
    const out = [];
    nums.forEach((n, i) => {
      if (i && n - nums[i - 1] > 1) out.push("…");
      out.push(n);
    });
    return out;
  }

  function renderPager() {
    const last = Math.max(1, Math.ceil(total / PAGE_SIZE));
    const pager = $("pager"), info = $("pager-info");
    if (last <= 1) {
      pager.replaceChildren();
      info.textContent = "";
      return;
    }
    const go = n => el("button", { type: "button", textContent: String(n) });
    const items = pageNumbers(page, last).map(n => {
      if (n === "…") return el("span", { className: "gap", textContent: "…" });
      const b = go(n);
      b.setAttribute("aria-label", `${n}쪽`);
      if (n === page) b.setAttribute("aria-current", "page");
      b.addEventListener("click", () => goTo(n));
      return b;
    });
    const prev = el("button", { type: "button", textContent: "이전", disabled: page <= 1 });
    const next = el("button", { type: "button", textContent: "다음", disabled: page >= last });
    prev.addEventListener("click", () => goTo(page - 1));
    next.addEventListener("click", () => goTo(page + 1));
    pager.replaceChildren(prev, ...items, next);
    info.textContent = `${page}쪽 / 총 ${last}쪽 · ${PAGE_SIZE}개씩`;
  }

  async function goTo(n) {
    if (loadingPage || n === page) return;
    await load(n);
    window.scrollTo({ top: 0 });
  }

  function renderCard(r) {
    const stars = el("span", { className: "stars" }, "★".repeat(r.rating), el("span", { className: "off", textContent: "★".repeat(5 - r.rating) }));
    stars.setAttribute("role", "img");
    stars.setAttribute("aria-label", `별점 ${r.rating}점`);

    const btn = el("button", { type: "button", className: r.sentiment ? "" : "primary", textContent: r.sentiment ? "다시 분석" : "AI 분석" });
    const top = el("div", { className: "top" }, stars, el("span", { className: "date", textContent: formatDate(r.written_at) }));
    if (r.sentiment) top.append(el("span", { className: `badge ${SENTIMENT_CLASS[r.sentiment] || "normal"}`, textContent: r.sentiment }));
    top.append(el("span", { className: "spacer" }), btn);

    const card = el("article", { className: "card" }, top, el("p", { className: "content", textContent: r.content }));
    if (r.reply) {
      card.append(el("div", { className: "reply" }, el("div", { className: "label", textContent: "답글 초안" }), el("p", { textContent: r.reply })));
    }

    btn.addEventListener("click", async () => {
      btn.disabled = true;
      btn.textContent = "분석 중...";
      let saving = false; // AI 분석은 끝나고 저장하는 중인지
      try {
        const { sentiment, reply } = await analyze(r);
        saving = true;
        const [saved] = await db(`reviews?id=eq.${r.id}`, { method: "PATCH", body: JSON.stringify({ sentiment, reply }) });
        if (!saved) throw Object.assign(new Error("review not found"), { gone: true }); // 그 사이 지워진 리뷰
        if (!r.sentiment) analyzedTotal += 1; // 처음 분석한 리뷰면 "분석함" 숫자를 올린다
        Object.assign(r, { sentiment: saved.sentiment, reply: saved.reply });
        toast(`분석 결과를 저장했습니다. 감정: ${saved.sentiment}`);
      } catch (e) {
        toast(saving ? friendly(e, "분석 결과를 저장하") : aiFriendly(e, "AI 분석을 하"), true);
        if (e.gone) load();
      }
      render();
    });
    return card;
  }

  function render() {
    renderSummary();
    renderPager();
    $("list").replaceChildren(...(reviews.length
      ? reviews.map(renderCard)
      : [el("div", { className: "empty", textContent: "아직 리뷰가 없습니다." })]));
  }

  // target 쪽의 리뷰 5개와 전체·분석 개수를 불러온다
  async function load(target = page) {
    loadingPage = true;
    try {
      const [list, done] = await Promise.all([
        dbList(`reviews?select=*&order=written_at.desc,id.desc&limit=${PAGE_SIZE}&offset=${(target - 1) * PAGE_SIZE}`),
        dbList("reviews?select=id&sentiment=not.is.null&limit=1"),
      ]);
      total = list.total ?? (target - 1) * PAGE_SIZE + list.rows.length + (list.rows.length === PAGE_SIZE ? 1 : 0);
      analyzedTotal = done.total ?? 0;
      const last = Math.max(1, Math.ceil(total / PAGE_SIZE));
      if (target > last) return load(last); // 그 사이 리뷰가 줄어 마지막 쪽을 넘은 경우
      page = target;
      reviews = list.rows;
      render();
    } catch (e) {
      const retry = el("button", { type: "button", textContent: "다시 불러오기" });
      retry.addEventListener("click", () => load(target));
      $("pager").replaceChildren();
      $("pager-info").textContent = "";
      $("list").replaceChildren(el("div", { className: "error" }, friendly(e, "리뷰를 불러오"), el("br"), retry));
    } finally {
      loadingPage = false;
    }
  }

  load();
</script>
</body>
</html>
